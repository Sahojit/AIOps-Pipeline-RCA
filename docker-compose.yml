version: "3.9"

networks:
  rca_net:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: rca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rca_db
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_user -d rca_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rca_net

  rca-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rca_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rca_user:rca_pass@postgres:5432/rca_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      MODEL_FILENAME: rca_model_v1.pkl
      RCA_API_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rca_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rca-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: rca_dashboard
    restart: unless-stopped
    environment:
      RCA_API_URL: http://rca-api:8000
    ports:
      - "8501:8501"
    depends_on:
      rca-api:
        condition: service_healthy
    networks:
      - rca_net
