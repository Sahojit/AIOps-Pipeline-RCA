databases:
  - name: rca-postgres
    databaseName: rca_db
    user: rca_user
    plan: free

services:
  - type: web
    name: rca-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api.render
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rca-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_FILENAME
        value: rca_model_v1.pkl

  - type: web
    name: rca-dashboard
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.dashboard.render
    dockerContext: .
    plan: free
    envVars:
      - key: RCA_API_URL
        value: https://rca-api.onrender.com
