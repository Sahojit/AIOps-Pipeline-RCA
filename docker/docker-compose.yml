# =============================================================================
# docker/docker-compose.yml
# =============================================================================
# Orchestrates the full AIOps Pipeline RCA stack:
#   - PostgreSQL 16 (database)
#   - RCA API      (FastAPI on port 8000)
#   - Dashboard    (Streamlit on port 8501)
#
# Usage:
#   cd docker/
#   docker compose up -d            # Start all services
#   docker compose logs -f rca-api  # Tail API logs
#   docker compose down             # Stop and remove containers
#
# First time? Train the model first:
#   python -m src.training.train_model
#   # This creates models/rca_model_v1.pkl (mounted into rca-api)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — stores failure events and RCA predictions
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rca-postgres
    environment:
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_pass
      POSTGRES_DB: rca_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_user -d rca_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RCA API — FastAPI prediction service
  # ---------------------------------------------------------------------------
  rca-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: sahojit/rca-api:latest
    container_name: rca-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rca_user:rca_pass@postgres:5432/rca_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      API_WORKERS: "2"
    volumes:
      - ../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard — Streamlit monitoring UI
  # ---------------------------------------------------------------------------
  rca-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    image: sahojit/rca-dashboard:latest
    container_name: rca-dashboard
    ports:
      - "8501:8501"
    environment:
      RCA_API_URL: http://rca-api:8000
    depends_on:
      rca-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
